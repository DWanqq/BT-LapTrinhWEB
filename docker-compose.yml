version: '3.8'

services:
  website1:
    build: ./website1
    container_name: running-website1
    restart: always

  website2:
    build: ./website2
    container_name: running-website2
    restart: always

  nginx:
    image: nginx:alpine
    container_name: running-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - website1
      - website2
    restart: always